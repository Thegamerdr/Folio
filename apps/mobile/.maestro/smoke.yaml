# Smoke: app launches, Today renders, all four tabs alive.
# Non-destructive — never clears state. If the onboarding sheet is open (fresh install or
# skipped onboarding), it is dismissed via its own Skip path first (keeps sample data, loses
# nothing). Run: maestro test .maestro/smoke.yaml
appId: com.folio.v2.greenfield
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Sample numbers|spare|What should Melo call you\\?"
    timeout: 20000
- runFlow:
    when:
      visible: "Skip for now"
    commands:
      - tapOn: "Skip for now"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
- tapOn: "Today"
- assertVisible: "spare"
- tapOn: "Review"
- tapOn: "Melo"
- tapOn: "More"
- assertVisible: "Start fresh"
- assertVisible: "Reminders"
- tapOn: "Today"
